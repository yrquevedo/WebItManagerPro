<form action="../php/insertarProducto.php" method="post" onsubmit="return validarRegistro()">

<label>Producto</label>
<select name="fnombre" id="producto" required onchange="rellenarProducto()">
    <option value="">Selecciona un producto</option>

    <option value="SSD Samsung 1TB">SSD Samsung 1TB</option>

    <option value="Disco Externo WD 2TB">Disco Externo WD 2TB</option>

    <option value="Monitor LG 27 pulgadas">Monitor LG 27 pulgadas</option>

            <label>Descripción</label>
            <input type="text" name="fdescripcion" id="descripcion" readonly required>

            <label>Categoría</label>
            <input type="text" name="fcategoria" id="categoria" readonly required>

            <label>Marca</label>
            <input type="text" name="fmarca" id="marca" readonly required>

            <label>Vista previa del producto</label>

            <!-- Campo oculto que enviará la imagen al PHP -->
            <input type="hidden" name="fimagen" id="imagen">

            <!-- Imagen del producto -->
            <img src="" id="previewImagen" class="producto-img" style="display:none;">

            <p id="nombreProductoImagen" class="texto-info"></p>

            <label>Cantidad</label>
            <input type="number" name="fcantidad" id="cantidad" placeholder="Ejemplo: 10" required>
